<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antigravity Research</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --accent:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --accent:#f87171; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:32px; margin:0 0 12px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Antigravity Research</h1>
  <p>An internal research tool that uses the official Pinterest API to analyze pins, boards and trending
  keywords for content planning. It does not post on behalf of other users and does not share data with
  third parties.</p>
  <p><a href="privacy/">Privacy Policy</a> &middot; Contact: <a href="mailto:ibrahimcokal@gmail.com">ibrahimcokal@gmail.com</a></p>
</main>
